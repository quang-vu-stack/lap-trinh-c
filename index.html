ánh giá, không phải chấm bài tự động.</div></div></div></div></div>`;}

 điểm (${questions.length} câu)</button>`:`<button class="btn btn-primary" data-action="retakeQuiz">↺ Làm lại chương này</button>`}</div></div>`;}
function videosPage(){return `<h1 class="page-title">Thư viện video bài giảng</h1><p class="page-sub">Video công khai từ các giảng viên độc lập, bao gồm nội dung tiếng Việt và tiếng Anh. Nhấp phát để xem ngay trong website hoặc mở YouTube.</p><div class="video-grid">${DATA.videos.map(v=>`<article class="video-card"><div class="video-thumb" style="background-image:linear-gradient(#10182738,#10182738),url('https://i.ytimg.com/vi/${v.id}/hqdefault.jpg')"><button class="play-btn" data-action="playVideo" data-id="${v.id}" title="Xem video" aria-label="Xem ${esc(v.title)}">▶</button></div><div class="video-card-text"><div class="pills"><span class="pill">${esc(v.language)}</span><span class="pill green">Miễn phí trên YouTube</span><span class="pill">${esc(v.duration)}</span></div><h3>${esc(v.title)}</h3><p>${esc(v.description)}</p><div class="pills"><button class="btn btn-primary btn-sm" data-action="playVideo" data-id="${v.id}">▶ Phát video</button><a class="btn btn-outline btn-sm" href="https://www.youtube.com/watch?v=${v.id}" target="_blank" rel="noopener noreferrer">Mở YouTube ↗</a></div></div></article>`).join('')}</div>${videoActive?`<div class="section-heading" id="videoPlayer"><h2>Đang xem video</h2><button class="btn btn-outline btn-sm" data-action="closeVideo">✕ Đóng</button></div><div class="video-big"><iframe class="video-frame" src="https://www.youtube-nocookie.com/embed/${videoActive}?rel=0" allow="accelerometer; autoplay; encrypted-media; gyroscope; picture-in-picture" allowfullscreen referrerpolicy="strict-origin-when-cross-origin" title="Video bài giảng C"></iframe></div>`:''}<div class="notice" style="margin-top:17px"><span>▶</span><div><strong>Video được lưu dưới dạng liên kết, không tải lại nội dung.</strong> Cần internet để xem. Bạn có thể bật phụ đề tự động trên YouTube với video tiếng Anh.</div></div>`;}
function notesPage(){return `<h1 class="page-title">Sổ tay lập trình C</h1><p class="page-sub">Ghi lại công thức, lỗi sai, điều bạn vừa học được. Dữ liệu được lưu trên trình duyệt hiện tại.</p><div class="layout-two"><div class="panel"><h3>📝 Ghi chú của bạn</h3><textarea id="notesEditor" class="notes-area" placeholder="Ví dụ: scanf với double dùng %lf, còn printf dùng %f...">${esc(state.notes.global||'')}</textarea><div style="display:flex;justify-content:space-between;align-items:center;margin-top:10px"><span class="muted" style="font-size:10px">Tự động lưu khi bạn gõ</span><button class="btn btn-outline btn-sm" data-action="export">↓ Sao lưu mọi tiến độ</button></div></div><aside class="panel"><h3>📌 Bảng ghi nhớ nhanh</h3>${[['In văn bản','printf("Hello\\n");'],['Nhập số nguyên','scanf("%d", &n);'],['Nhập số thực','scanf("%lf", &x);'],['Mảng','int a[100];'],['Con trỏ','int *p = &x;'],['Biên dịch GCC','gcc -std=c11 -Wall -Wextra main.c -o main'],['Chạy trên Windows','./main hoặc .\\main.exe']].map(x=>`<div class="activity" style="align-items:flex-start"><div><strong>${esc(x[0])}</strong><small style="font-family:'JetBrains Mono';word-break:break-all">${esc(x[1])}</small></div></div>`).join('')}</aside></div>`;}
function render(){document.documentElement.dataset.theme=state.theme||'light';renderSidebar();$('#breadcrumb').textContent=({home:'Tổng quan',roadmap:'Lộ trình học',lesson:'Bài giảng',exercises:'Kho bài tập',lab:'Phòng thực hành',quiz:'Trắc nghiệm',videos:'Video bài giảng',notes:'Ghi chú'})[view];const screens={home,roadmap,lesson:lessonPage,exercises:exercisesPage,lab:labPage,quiz:quizPage,videos:videosPage,notes:notesPage};$('#app').innerHTML=screens[view]();if(view==='lab')updateNumbers();}
function updateNumbers(){const ta=$('#codeEditor'),ln=$('#lineNumbers');if(!ta||!ln)return;ln.textContent=Array.from({length:Math.max(ta.value.split('\n').length,1)},(_,i)=>i+1).join('\n');ln.scrollTop=ta.scrollTop;}
function download(name,content,type){const blob=new Blob([content],{type});const href=URL.createObjectURL(blob);let a=document.createElement('a');a.href=href;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(href),1000);}
async function clipboard(text){try{await navigator.clipboard.writeText(text);toast('Đã sao chép vào bộ nhớ tạm');}catch(e){const t=document.createElement('textarea');t.value=text;document.body.appendChild(t);t.select();try{document.execCommand('copy');toast('Đã sao chép mã nguồn');}catch(err){toast('Không sao chép được: hãy chọn mã rồi nhấn Ctrl+C');}t.remove();}}
async function runCode(){if(running)return;const code=getCurrentCode(),stdin=getCurrentStdin();if(code.length>20000){toast('Code quá dài, tối đa 20.000 ký tự cho mỗi lượt chạy.');return;}
 running=true;outputStatus='• đang biên dịch';outputText='Đang kết nối trình biên dịch GCC miễn phí...';$('#codeOutput').textContent=outputText;$('#runStatus').textContent=outputStatus;$('#runCodeBtn').textContent='⏳ Đang chạy...';$('#runCodeBtn').disabled=true;
 try{
  let compiler='gcc-head-c';
  if(!compilerListCache){const resp=await fetch('https://wandbox.org/api/list.json',{cache:'force-cache',signal:AbortSignal.timeout(16000)});if(!resp.ok)throw Error('Không lấy được danh sách compiler ('+resp.status+')');compilerListCache=await resp.json();}
  const cands=compilerListCache.filter(x=>x.language==='C' && x.name&&x.name.startsWith('gcc-'));if(cands.length)compiler=cands.find(x=>x.name==='gcc-head-c')?.name||cands[0].name;
  const compilerItem=compilerListCache.find(x=>x.name===compiler);const req={compiler,code,stdin};
  if(compilerItem&&compilerItem['compiler-option-raw'])req['compiler-option-raw']='-std=c11\n-Wall\n-Wextra';
  const resp=await fetch('https://wandbox.org/api/compile.json',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(req),signal:AbortSignal.timeout(30000)});
  if(!resp.ok)throw Error('Máy chủ trả lỗi HTTP '+resp.status);
  const result=await resp.json();
  const compilerErr=String(result.compiler_error||'');const compilerOut=String(result.compiler_output||'');const programOut=String(result.program_output||'');const programErr=String(result.program_error||'');
  let parts=[];if(compilerOut.trim())parts.push('[Thông báo biên dịch]\n'+compilerOut);if(compilerErr.trim())parts.push('[Lỗi/cảnh báo biên dịch]\n'+compilerErr);if(programOut.trim())parts.push('[stdout]\n'+programOut);if(programErr.trim())parts.push('[stderr]\n'+programErr);
  if(result.signal)parts.push('[Tín hiệu dừng] '+result.signal);
  outputText=parts.join('\n\n')||'(Chương trình không in gì ra màn hình)';outputStatus=compilerErr.trim()||result.status && result.status!=='0'?'• kiểm tra lỗi':'• đã chạy';
 }catch(err){outputText='Không thể sử dụng dịch vụ biên dịch online lúc này.\n\nChi tiết: '+String(err.message||err)+'\n\nBạn có thể tải tệp .c và chạy bằng GCC trên máy hoặc dán code vào Programiz: https://www.programiz.com/c-programming/online-compiler/';outputStatus='• lỗi kết nối';}
 finally{running=false;const box=$('#codeOutput');if(box)box.textContent=outputText;const st=$('#runStatus');if(st)st.textContent=outputStatus;const btn=$('#runCodeBtn');if(btn){btn.textContent='▶ Chạy code C';btn.disabled=false;}}
}
function toggleSidebar(open){const s=$('#sidebar');s.classList.toggle('open',open);$('#backdrop').classList.toggle('open',open);}
function exportData(){download('c-academy-tien-do.json',JSON.stringify({type:'c-academy-progress',version:1,exportedAt:new Date().toISOString(),data:state},null,2),'application/json;charset=utf-8');toast('Đã xuất bản sao tiến độ.');}
async function importData(file){if(!file||file.size>3000000){toast('File sao lưu không hợp lệ hoặc quá lớn.');return;}try{const obj=JSON.parse(await file.text());if(obj.type!=='c-academy-progress'||!obj.data||typeof obj.data!=='object')throw Error('Sai định dạng');if(!confirm('Khôi phục bản sao sẽ thay thế tiến độ và code đang lưu trong trình duyệt này. Tiếp tục?'))return;state={...defaults,...obj.data};save();render();toast('Đã khôi phục tiến độ học.');}catch(e){toast('Không thể nhập file: '+e.message);}}
document.body.addEventListener('click',async ev=>{const target=ev.target.closest('[data-action]');if(!target)return;const action=target.dataset.action;const id=target.dataset.id;switch(action){
case 'view':go(target.dataset.view);toggleSidebar(false);break;
case 'sidebar':toggleSidebar(!$('#sidebar').classList.contains('open'));break;
case 'theme':state.theme=state.theme==='dark'?'light':'dark';save();render();break;
case 'openModule':roadmapSelected=String(target.dataset.module);go('roadmap');break;
case 'lesson':openLesson(target.dataset.lesson);toggleSidebar(false);break;
case 'exercise':openExercise(id);toggleSidebar(false);break;
case 'toggleLearn':state.learned[target.dataset.lesson]=!state.learned[target.dataset.lesson];save();render();toast(state.learned[target.dataset.lesson]?'Đã hoàn thành bài học!':'Đã bỏ đánh dấu bài học.');break;
case 'toggleDone':state.done[id]=!state.done[id];save();render();toast(state.done[id]?'Tốt lắm! Đã ghi nhận bài tập.':'Đã bỏ đánh dấu hoàn thành.');break;
case 'hint':hintVisible=!hintVisible;render();break;
case 'nextExercise':{const idx=DATA.exercises.findIndex(e=>e.id===activeExercise);openExercise(DATA.exercises[Math.min(idx+1,DATA.exercises.length-1)].id);break;}
case 'prevExercise':{const idx=DATA.exercises.findIndex(e=>e.id===activeExercise);openExercise(DATA.exercises[Math.max(idx-1,0)].id);break;}
case 'loadExample':if(confirm('Nạp ví dụ lý thuyết vào trình soạn thảo? Code bài tập hiện tại vẫn có thể lưu nếu bạn không đặt lại.')){state.drafts[activeExercise]=lesson(activeLesson).code;save();render();toast('Đã nạp code ví dụ từ bài giảng.');}break;
case 'resetCode':if(confirm('Xóa nội dung đang viết cho bài tập này và tạo lại mẫu trống?')){delete state.drafts[activeExercise];save();render();toast('Đã đặt lại mã nguồn.');}break;
case 'exampleCopy':clipboard(lesson(Number(target.dataset.lesson)).code);break;
case 'copyCode':clipboard(getCurrentCode());break;
case 'downloadCode':download(activeExercise.toLowerCase()+'.c',getCurrentCode(),'text/x-c;charset=utf-8');toast('Đã tải file .c');break;
case 'runCode':runCode();break;
case 'moreExercises':exerciseLimit+=24;$('#exerciseResults').innerHTML=exerciseCards();break;
case 'export':exportData();break;
case 'import':$('#importFile').click();break;
case 'submitQuiz':{const qs=DATA.quizzes.map((q,i)=>({...q,index:i})).filter(x=>String(x.module)===quizModule);const missing=qs.filter(q=>quizAnswers[q.index]===undefined).length;if(missing && !confirm(`Bạn chưa trả lời ${missing} câu. Vẫn muốn nộp?`))break;const correct=qs.filter(q=>quizAnswers[q.index]===q.answer).length;state.quizResults[quizModule]={correct,total:qs.length,date:new Date().toISOString()};quizRevealed=true;save();render();window.scrollTo({top:0,behavior:'smooth'});toast('Đã chấm bài trắc nghiệm.');break;}
case 'retakeQuiz':quizAnswers={};quizRevealed=false;render();break;
case 'playVideo':videoActive=id;render();setTimeout(()=>$('#videoPlayer')?.scrollIntoView({behavior:'smooth',block:'start'}),30);break;
case 'closeVideo':videoActive='';render();break;
}});
document.body.addEventListener('input',ev=>{const t=ev.target;if(t.id==='codeEditor'){state.drafts[activeExercise]=t.value;save();updateNumbers();}if(t.id==='stdinEditor'){state.stdin[activeExercise]=t.value;save();}if(t.id==='notesEditor'){state.notes.global=t.value;save();}if(t.id==='exerciseSearch'){exerciseSearch=t.value;exerciseLimit=18;$('#exerciseResults').innerHTML=exerciseCards();}});
document.body.addEventListener('change',ev=>{const t=ev.target;if(t.id==='exerciseModule'){exerciseModule=t.value;exerciseLimit=18;$('#exerciseResults').innerHTML=exerciseCards();}if(t.id==='exerciseDifficulty'){exerciseDifficulty=t.value;exerciseLimit=18;$('#exerciseResults').innerHTML=exerciseCards();}if(t.id==='roadmapModule'){roadmapSelected=t.value;render();}if(t.id==='quizModule'){quizModule=t.value;quizAnswers={};quizRevealed=false;render();}if(t.id==='importFile')importData(t.files?.[0]);if(t.dataset.qindex!==undefined)quizAnswers[Number(t.dataset.qindex)]=Number(t.value);});
document.body.addEventListener('keydown',ev=>{const t=ev.target;if(t.id==='codeEditor'&&ev.key==='Tab'){ev.preventDefault();const a=t.selectionStart,b=t.selectionEnd;t.setRangeText('    ',a,b,'end');state.drafts[activeExercise]=t.value;save();updateNumbers();}if((t.dataset.action==='openModule'||t.dataset.action==='lesson'||t.dataset.action==='exercise')&&(ev.key==='Enter'||ev.key===' ')){ev.preventDefault();t.click();}});
document.body.addEventListener('scroll',ev=>{if(ev.target.id==='codeEditor')updateNumbers();},true);
$('#globalSearch').addEventListener('keydown',ev=>{if(ev.key==='Enter'){exerciseSearch=ev.target.value;exerciseModule='all';exerciseDifficulty='all';exerciseLimit=18;go('exercises');}});
$('#backdrop').addEventListener('click',()=>toggleSidebar(false));
document.addEventListener('keydown',ev=>{if((ev.ctrlKey||ev.metaKey)&&ev.key.toLowerCase()==='s'&&view==='lab'){ev.preventDefault();save();toast('Code đã được lưu.');}if((ev.ctrlKey||ev.metaKey)&&ev.key.toLowerCase()==='k'){ev.preventDefault();$('#globalSearch').focus();}});
render();
</script>
</body>
</html>
